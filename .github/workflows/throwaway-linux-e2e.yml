# THROWAWAY. Not part of the product. Runs the Deployment Guide's Compose path
# (§2.2 command block, verbatim) on a genuine Linux Docker Engine host: the
# ubuntu-latest runner is x86-64 with NO QEMU binfmt handlers, i.e. the plain
# server a self-hosting customer actually has, which Docker Desktop cannot
# reproduce. It lives on main only because workflow_dispatch requires the file
# there; a cleanup PR removes it once the Linux path is proven.
#
# Lesson baked in from run 34408655287: the setup.sh step there used `set +e`
# so the diagnostics could run, and the step's green tick was then misread as
# a pass while setup.sh had exited 1. This version records the real exit code,
# waits for the stack the way the guide tells the reader to, captures the logs
# of every unhealthy container, and fails the job in a final verdict step.
name: Throwaway Linux E2E (do not merge)

on:
  workflow_dispatch:
    inputs:
      license_token:
        description: "Tetrix license token (masked in logs)"
        required: true
        type: string
      source:
        description: "release = the published bundle (version + sha256 below); branch = --dev-main copy of the branch below"
        required: true
        type: choice
        options: [release, branch]
        default: branch
      version:
        description: "release only: version to install (no leading v)"
        required: false
        default: "0.9.0"
        type: string
      sha256:
        description: "release only: SHA-256 of deploy-docker-<version>.tgz"
        required: false
        default: "03da2e6dc97e0c95c53d217bc3f929831b4740b369058551904f746e5b43cfab"
        type: string
      branch:
        description: "branch only: tetrix-install ref to copy with --dev-main"
        required: false
        default: "main"
        type: string
      set_platform_amd64:
        description: "Also apply the guide's documented Intel/AMD64 step (FRONTEND_/COLLECTORS_PLATFORM=linux/amd64 in .env). Off = the §2.2 command block only."
        required: false
        type: boolean
        default: false

jobs:
  linux-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE: ${{ inputs.source }}
      BUNDLE_VERSION: ${{ inputs.version }}
      BUNDLE_SHA256: ${{ inputs.sha256 }}
      BUNDLE_BRANCH: ${{ inputs.branch }}
      SET_PLATFORM_AMD64: ${{ inputs.set_platform_amd64 }}
    steps:
      - name: Mask the license token
        env:
          LICENSE_TOKEN: ${{ inputs.license_token }}
        run: echo "::add-mask::${LICENSE_TOKEN}"

      - name: Host baseline (what Docker Desktop cannot be)
        run: |
          echo "kernel:  $(uname -a)"
          echo "arch:    $(uname -m)"
          echo "docker:  $(docker --version)"
          echo "compose: $(docker compose version)"
          echo "ulimit -l: $(ulimit -l)"
          echo "cpus: $(nproc)  mem: $(free -m | awk '/^Mem:/{print $2" MiB"}')"
          echo "qemu binfmt handlers registered: $(ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -c '^qemu-' || true)"
          id

      - name: Control probe — what a forced-arm64 container does on this host
        run: |
          set +e
          docker pull -q --platform linux/arm64 busybox:1.37 >/dev/null 2>&1
          out=$(docker run --rm --platform linux/arm64 busybox:1.37 true 2>&1); rc=$?
          echo "forced linux/arm64 -> exit=${rc} ${out}"
          docker pull -q --platform linux/amd64 busybox:1.37 >/dev/null 2>&1
          out=$(docker run --rm --platform linux/amd64 busybox:1.37 true 2>&1); rc=$?
          echo "forced linux/amd64 -> exit=${rc} ${out}"
          docker rmi -f busybox:1.37 >/dev/null 2>&1 || true

      - name: 1. Download the compose bundle
        run: |
          set -eo pipefail
          if [ "$SOURCE" = "release" ]; then
            echo "guide §2.2, verbatim: signed release ${BUNDLE_VERSION}"
            curl -fsSL https://raw.githubusercontent.com/deskree-inc/tetrix-install/main/scripts/download.sh \
              | bash -s -- --version "$BUNDLE_VERSION" --sha256 "$BUNDLE_SHA256" ~/tetrix-docker
          else
            echo "--dev-main copy of ${BUNDLE_BRANCH} (unversioned; install-release.sh's permission fix does NOT run on this path)"
            curl -fsSL "https://raw.githubusercontent.com/deskree-inc/tetrix-install/${BUNDLE_BRANCH}/scripts/download.sh" \
              | TETRIX_DOCKER_BRANCH="$BUNDLE_BRANCH" bash -s -- --dev-main ~/tetrix-docker
          fi
          test -d ~/tetrix-docker || { echo "download did not produce ~/tetrix-docker"; exit 1; }
          echo "bundle VERSION file: $(cat ~/tetrix-docker/VERSION)"
          echo "platform pins left in docker-compose.yml: $(grep -c '^\s*platform:' ~/tetrix-docker/docker-compose.yml || true)"

      - name: Permission check before any workaround (F-02)
        run: |
          cd ~/tetrix-docker
          echo "world-unreadable entries within two levels (release path: expect none):"
          find . -maxdepth 2 ! -perm -o+r 2>/dev/null | grep -v '^\.$' || echo "  (none)"
          [ "$SOURCE" = "release" ] || echo "  (branch mode: this is the tarball's umask result, not install-release.sh's — informational only)"

      - name: 2. Create .env and set LICENSE_TOKEN (guide §2.2)
        env:
          LICENSE_TOKEN: ${{ inputs.license_token }}
        run: |
          cd ~/tetrix-docker
          cp .env.example .env
          sed -i "s#^LICENSE_TOKEN=.*#LICENSE_TOKEN=${LICENSE_TOKEN}#" .env
          if [ "$SET_PLATFORM_AMD64" = "true" ]; then
            echo "applying the guide's Intel/AMD64 prose step"
            sed -i -e 's#^FRONTEND_PLATFORM=.*#FRONTEND_PLATFORM=linux/amd64#' -e 's#^COLLECTORS_PLATFORM=.*#COLLECTORS_PLATFORM=linux/amd64#' .env
            grep -q '^FRONTEND_PLATFORM=' .env || printf 'FRONTEND_PLATFORM=linux/amd64\nCOLLECTORS_PLATFORM=linux/amd64\n' >> .env
          fi
          echo "platform vars in .env:"; grep -E '^(FRONTEND|COLLECTORS)_PLATFORM=' .env || echo "  (none — Docker selects the host platform)"
          echo "trio pin: $(grep '^ADMIN_API_IMAGE_TAG=' .env)"
          chmod +x scripts/setup.sh

      - name: 3. Run setup.sh (single pass, no retry, no workaround)
        id: setup
        env:
          OPENAI_API_KEY: "sk-linux-e2e-placeholder"
        run: |
          cd ~/tetrix-docker
          set +e
          ./scripts/setup.sh
          rc=$?
          set -e
          echo "setup.sh exit=${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: 4. Wait for the stack (guide §2.4 says 3–6 minutes; allow 8)
        id: wait
        if: always()
        run: |
          cd ~/tetrix-docker
          deadline=$((SECONDS + 480)); healthy=false
          while :; do
            bad=$(docker compose ps -a --format json | jq -rs '
              [ .[] | select(
                  (.State == "restarting" or .State == "created" or .State == "paused" or .State == "dead")
                  or (.State == "exited" and .ExitCode != 0)
                  or (.State == "running" and (.Health != "" and .Health != "healthy"))
                ) | "\(.Service) \(.State) health=\(.Health) exit=\(.ExitCode)" ] | .[]')
            n=$(printf '%s' "$bad" | grep -c . || true)
            echo "t+$((SECONDS))s: ${n} container(s) not settled"
            if [ "$n" -eq 0 ]; then healthy=true; break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "gave up after 8 minutes; still unsettled:"; printf '%s\n' "$bad"; break
            fi
            sleep 15
          done
          echo "healthy=${healthy}" >> "$GITHUB_OUTPUT"

      - name: Service state
        if: always()
        run: |
          cd ~/tetrix-docker
          docker compose ps -a --format 'table {{.Name}}\t{{.State}}\t{{.Status}}'

      - name: Per-container evidence (exit code, runtime error, image arch vs host)
        if: always()
        run: |
          cd ~/tetrix-docker
          host=$(docker version --format '{{.Server.Arch}}')
          printf '%-42s %-11s %-5s %-7s %s\n' CONTAINER STATE EXIT IMGARCH ERROR
          for c in $(docker compose ps -aq); do
            docker inspect "$c" --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}} {{.Image}} {{.State.Error}}' \
            | while read -r name state code img err; do
                arch=$(docker image inspect "$img" --format '{{.Architecture}}' 2>/dev/null || echo '?')
                flag=""; [ "$arch" != "$host" ] && flag=" <-- not ${host}"
                printf '%-42s %-11s %-5s %-7s %s%s\n' "${name#/}" "$state" "$code" "$arch" "$err" "$flag"
              done
          done

      - name: Logs of every container that is not clean
        if: always()
        run: |
          cd ~/tetrix-docker
          for c in $(docker compose ps -aq); do
            read -r name state code < <(docker inspect "$c" --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}}')
            case "$state:$code" in
              running:*|exited:0) : ;;
              *) echo "::group::${name#/} (${state}, exit ${code})"; docker logs --tail 80 "$c" 2>&1 || true; echo "::endgroup::" ;;
            esac
          done
          echo "::group::daemon + remote (restart counts + last lines)"
          for s in daemon remote; do
            c=$(docker compose ps -aq "$s" 2>/dev/null | head -1); [ -n "$c" ] || continue
            echo "-- $s restarts=$(docker inspect "$c" --format '{{.RestartCount}}')"; docker logs --tail 25 "$c" 2>&1 || true
          done
          echo "::endgroup::"
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/compose-logs.txt" 2>&1 || true
          docker compose ps -a > "$RUNNER_TEMP/compose-ps.txt" 2>&1 || true

      - name: Upload full compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: |
            ${{ runner.temp }}/compose-logs.txt
            ${{ runner.temp }}/compose-ps.txt
          retention-days: 7

      - name: Vault mlock check (F-03)
        if: always()
        run: |
          cd ~/tetrix-docker
          docker inspect tetrix-vault-1 --format 'vault: {{.State.Status}} health={{.State.Health.Status}}' || true
          docker compose logs vault --tail=30 | grep -i mlock || echo "no mlock error in vault logs -- good"

      - name: vault-init file ownership (F-04)
        if: always()
        run: |
          cd ~/tetrix-docker
          ls -la runtime/ 2>/dev/null | grep vault || echo "(no runtime/vault*.env yet)"
          echo "expect: owned by $(id -un), not root"

      - name: Guide §2.4 checklist
        if: always()
        run: |
          echo "hosts entry: $(getent hosts tetrix.local || echo MISSING)"
          for u in "https://tetrix.local/" "https://tetrix.local/auth/realms/tetrix/.well-known/openid-configuration" "https://tetrix.local/api/v1"; do
            printf '%-75s -> %s\n' "$u" "$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "$u" || echo FAIL)"
          done
          printf '%-75s -> %s\n' "POST https://tetrix.local/mcp" "$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 -X POST https://tetrix.local/mcp -d '{}' || echo FAIL)"
          echo "certificate: $(echo | openssl s_client -connect tetrix.local:443 -servername tetrix.local 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || echo none)"

      - name: Summary
        if: always()
        env:
          SETUP_RC: ${{ steps.setup.outputs.rc }}
          HEALTHY: ${{ steps.wait.outputs.healthy }}
        run: |
          {
            echo "### Throwaway Linux E2E"
            echo
            echo "| item | value |"; echo "|---|---|"
            echo "| host | $(uname -m), $(docker --version | cut -d, -f1), binfmt qemu handlers: $(ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -c '^qemu-' || true) |"
            echo "| source | ${SOURCE} $( [ "$SOURCE" = release ] && echo "${BUNDLE_VERSION}" || echo "branch ${BUNDLE_BRANCH}" ) |"
            echo "| guide's Intel/AMD64 .env step applied | ${SET_PLATFORM_AMD64} |"
            echo "| setup.sh exit code | ${SETUP_RC:-not run} |"
            echo "| stack settled within 8 min | ${HEALTHY:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown
        if: always()
        run: cd ~/tetrix-docker 2>/dev/null && docker compose down -v || true

      - name: Verdict (the job is red unless setup.sh exited 0 AND the stack settled)
        if: always()
        env:
          SETUP_RC: ${{ steps.setup.outputs.rc }}
          HEALTHY: ${{ steps.wait.outputs.healthy }}
        run: |
          echo "setup.sh exit=${SETUP_RC:-none}  stack settled=${HEALTHY:-unknown}"
          [ "${SETUP_RC}" = "0" ] && [ "${HEALTHY}" = "true" ]
