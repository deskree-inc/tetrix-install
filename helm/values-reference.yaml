# Customer-safe Helm values skeleton for Tetrix Enterprise 0.8.54 (latest published chart).
# Commented keys only — no hostnames, no secrets, no cluster names.
#
# Install:
#   helm upgrade --install tetrix \
#     oci://registry-1.docker.io/deskree/tetrixaidb-chart \
#     --version 0.8.54 \
#     --namespace tetrix --create-namespace \
#     --timeout 25m --wait=false \
#     -f values-reference.yaml \
#     --set ingress.host=tetrix.yourcompany.com \
#     --set ingress.tls.certManager.clusterIssuer=letsencrypt-prod \
#     --set-file secrets.licenseToken=./license.jwt
#
# Full machine-readable catalog:
#   helm show values oci://registry-1.docker.io/deskree/tetrixaidb-chart --version 0.8.54
# Curated parameter tables: ../HELM.md

# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------
# global:
#   imageOrigin: "registry.deskree.com/"   # "" = Docker Hub (private deskree/*; needs a pull secret)
#   imageRegistry: ""                      # air-gapped mirror prefix, e.g. registry.internal/
#   imagePullSecrets: []                   # [{name: your-dockerhub-secret}] on the Docker Hub path
#   imageTag: ""
#   storageClass: ""                       # empty = cluster default

# ---------------------------------------------------------------------------
# Ingress and TLS
# ---------------------------------------------------------------------------
ingress:
  # host: tetrix.example.com               # required; must resolve from inside the cluster
  # publicPort: ""                         # e.g. "18080" for kubectl port-forward evaluation
  tls:
    # enabled: true                        # false only for localhost evaluation
    certManager:
      clusterIssuer: letsencrypt-prod
    # existingSecret: tetrix-tls           # alternative to cert-manager

# daemon:
#   oidcLoopbackProxy:
#     enabled: false                       # true only with publicPort on minikube / laptop

# traefik:
